<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Solo Leveling Fitness</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>🗡️ Solo Leveling Fitness</h1>

    <div class="card">
      <h2>Player Stats</h2>
      <p>Level: <span id="level">1</span></p>
      <p>XP: <span id="xp">0</span> / <span id="xpNeeded">100</span></p>

      <div class="xp-bar">
        <div id="xpBarFill"></div>
      </div>
    </div>

    <div class="card">
      <h2>Daily Mission</h2>
      <p>Do 20 Push-ups</p>
      <button onclick="completeMission()">Complete Mission</button>
    </div>

    <div id="popup" class="popup">🎉 Quest Completed!</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
