<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOGIN PAGE -->
<div id="loginPage" class="page active">
  <h2>Login</h2>
  <input type="text" placeholder="Enter Email or Phone">
  <button onclick="login()">Login</button>
</div>

<!-- MAIN APP -->
<div id="appPage" class="page">

  <!-- TOP NAV -->
  <header>
    <button onclick="showSection('home')">Home</button>
    <button onclick="showSection('workout')">Workout Splits</button>
    <button onclick="logout()">Logout</button>
  </header>

  <!-- CONTENT -->
  <main>

    <!-- HOME -->
    <section id="home" class="section active">
      <h2>Status</h2>
      <p>Level: <span id="level">1</span></p>
      <p>XP: <span id="xp">0</span>/<span id="xpNeeded">100</span></p>

      <div class="xp-bar">
        <div id="xpFill"></div>
      </div>
    </section>

    <!-- WORKOUT -->
    <section id="workout" class="section">
      <h2>Select Mode</h2>
      <button onclick="gainXP(20)">Home Workout</button>
      <button onclick="gainXP(30)">Gym Workout</button>
    </section>

  </main>

</div>

<script src="script.js"></script>
</body>
</html>
