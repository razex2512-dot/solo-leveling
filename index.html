<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOGIN PAGE -->
<div id="loginPage" class="page active">
  <div class="login-box">
    <h1>SYSTEM</h1>
    <p>Sign in to continue</p>
    <button onclick="loginGoogle()">Login with Google</button>
  </div>
</div>

<!-- APP PAGE -->
<div id="appPage" class="page">

  <!-- TOP NAV -->
  <header class="topbar">
    <h2>System</h2>
    <div>
      <button onclick="showSection('home')">Home</button>
      <button onclick="showSection('workout')">Workout</button>
      <button onclick="logout()">Logout</button>
    </div>
  </header>

  <!-- CONTENT -->
  <main>

    <!-- HOME -->
    <section id="home" class="section active">
      <div class="card">
        <h3>Status</h3>
        <p>Level <span id="level">1</span></p>

        <div class="xp-bar">
          <div id="xpFill"></div>
        </div>

        <p><span id="xp">0</span> / <span id="xpNeeded">100</span> XP</p>
      </div>
    </section>

    <!-- WORKOUT -->
    <section id="workout" class="section">
      <div class="card">
        <h3>Missions</h3>
        <div id="missions"></div>
      </div>
    </section>

  </main>

  <!-- MUSIC PLAYER -->
  <div class="music">
    <audio controls>
      <source src="assets/song.mp3" type="audio/mpeg">
    </audio>
  </div>

</div>

<script type="module" src="script.js"></script>
</body>
</html>
